<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem sơ đồ BPMN — SOL</title>
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/diagram-js.css">
<link rel="stylesheet" href="https://unpkg.com/bpmn-js@17.11.1/dist/assets/bpmn-font/css/bpmn.css">
<style>
  :root{ --bg:#f7f7f8; --panel:#ffffff; --panel2:#f2f3f5; --border:#e0e1e6; --text:#1c1e24; --muted:#6b7280; --accent:#b8863d; --accent2:#8a6221; }
  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; font-family:"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
  header{ padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; background:var(--panel); }
  header h1{ margin:0; font-size:16px; }
  header p{ margin:2px 0 0; color:var(--muted); font-size:12px; word-break:break-all; }
  .btns{ display:flex; gap:8px; flex-wrap:wrap; }
  button{ background:var(--panel); border:1px solid var(--border); color:var(--text); padding:7px 14px; border-radius:8px; font-size:12.5px; cursor:pointer; font-weight:600; }
  button:hover{ border-color:var(--accent); }
  button.primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border:none; }
  button.small{ padding:4px 10px; font-size:11.5px; }

  /* ---- Layout: 3/4 canvas + 1/4 sidebar ---- */
  #body-layout{ position:absolute; top:64px; left:0; right:0; bottom:0; display:flex; }
  #canvas-wrap{ position:relative; flex:0 0 75%; max-width:75%; height:100%; border-right:1px solid var(--border); }
  #canvas{ position:absolute; inset:0; }
  #sidebar{ flex:0 0 25%; max-width:25%; height:100%; overflow-y:auto; background:var(--panel); padding:18px 16px 40px; }
  @media (max-width:900px){
    #body-layout{ flex-direction:column; }
    #canvas-wrap{ flex:0 0 55%; max-width:100%; height:55%; border-right:none; border-bottom:1px solid var(--border); }
    #sidebar{ flex:0 0 45%; max-width:100%; height:45%; }
  }

  #sidebar h2{ margin:0 0 12px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); }
  .anno-card{ background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .anno-card .anno-id{ font-size:10.5px; color:var(--muted); margin-bottom:4px; letter-spacing:.3px; }
  .anno-card .anno-text{ font-size:13px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .anno-card .anno-text a{ color:var(--accent2); text-decoration:none; word-break:break-all; }
  .anno-card .anno-text a:hover{ text-decoration:underline; }
  .anno-empty{ color:var(--muted); font-size:12.5px; font-style:italic; padding:8px 0; }
  .sidebar-note{ font-size:11.5px; color:var(--muted); margin:0 0 14px; line-height:1.5; }

  .msg{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; max-width:520px; padding:24px; }
  .msg h2{ margin:0 0 8px; font-size:16px; }
  .msg p{ color:var(--muted); font-size:13px; line-height:1.6; }
  .msg code{ background:#eee; padding:2px 6px; border-radius:4px; font-size:12px; word-break:break-all; }
  #loading{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:var(--muted); font-size:13px; }
  .djs-palette{ display:none !important; } /* viewer only, không cần palette chỉnh sửa */
</style>
</head>
<body>

<header>
  <div>
    <h1 id="title">🗂️ Sơ đồ BPMN</h1>
    <p id="srcLabel">Đang tải...</p>
  </div>
  <div class="btns">
    <button class="primary" onclick="fitViewport()">🔍 Fit</button>
    <button onclick="zoom(1.2)">➕ Zoom in</button>
    <button onclick="zoom(0.8)">➖ Zoom out</button>
    <button id="downloadBtn" style="display:none">⬇️ Tải XML gốc</button>
    <button onclick="window.close()">Đóng</button>
  </div>
</header>

<div id="body-layout">
  <div id="canvas-wrap">
    <div id="canvas"></div>
    <div id="loading">⏳ Đang tải sơ đồ...</div>
  </div>
  <div id="sidebar">
    <h2>📌 Thông tin / Ghi chú</h2>
    <p class="sidebar-note">Nội dung các Text Annotation gắn trong sơ đồ (mẫu biểu, link tham chiếu, ghi chú nghiệp vụ...).</p>
    <div id="annoList"></div>
  </div>
</div>

<script src="https://unpkg.com/bpmn-js@17.11.1/dist/bpmn-navigated-viewer.production.min.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const src = params.get('src');
  const title = params.get('title');
  if (title) document.getElementById('title').textContent = '🗂️ ' + decodeURIComponent(title);

  let viewer = null;

  function showError(heading, detail){
    document.getElementById('loading').style.display = 'none';
    const box = document.createElement('div');
    box.className = 'msg';
    box.innerHTML = `<h2>⚠️ ${heading}</h2><p>${detail}</p>`;
    document.getElementById('canvas').appendChild(box);
  }

  function escapeHtml(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Biến text thành HTML, tự động biến URL thành link bấm được
  function linkify(text){
    const escaped = escapeHtml(text);
    const urlRegex = /((https?:\/\/|www\.)[^\s<]+)/gi;
    return escaped.replace(urlRegex, (match) => {
      const href = match.startsWith('http') ? match : 'https://' + match;
      return `<a href="${href}" target="_blank" rel="noopener">${match}</a>`;
    });
  }

  // Đọc trực tiếp XML để lấy các <bpmn:textAnnotation> — không phụ thuộc việc bpmn-js có render được hay không
  function renderAnnotations(xmlString){
    const listEl = document.getElementById('annoList');
    listEl.innerHTML = '';
    try{
      const doc = new DOMParser().parseFromString(xmlString, 'application/xml');
      const parserError = doc.querySelector('parsererror');
      if(parserError) throw new Error('XML parse error');

      const annotations = Array.from(doc.getElementsByTagNameNS('*', 'textAnnotation'));
      if(annotations.length === 0){
        listEl.innerHTML = '<div class="anno-empty">Sơ đồ này chưa có Text Annotation nào.</div>';
        return;
      }

      annotations.forEach(anno => {
        const id = anno.getAttribute('id') || '';
        const textEl = anno.getElementsByTagNameNS('*', 'text')[0];
        const text = textEl ? textEl.textContent.trim() : '';
        if(!text) return;
        const card = document.createElement('div');
        card.className = 'anno-card';
        card.innerHTML = `<div class="anno-id">${escapeHtml(id)}</div><div class="anno-text">${linkify(text)}</div>`;
        listEl.appendChild(card);
      });

      if(!listEl.innerHTML){
        listEl.innerHTML = '<div class="anno-empty">Sơ đồ này chưa có Text Annotation nào.</div>';
      }
    }catch(e){
      listEl.innerHTML = '<div class="anno-empty">Không đọc được ghi chú từ file (lỗi phân tích XML).</div>';
    }
  }

  if(!src){
    document.getElementById('srcLabel').textContent = 'Thiếu tham số ?src=';
    showError('Không có file để hiển thị', 'Trang này cần được mở với tham số <code>?src=&lt;link .bpmn&gt;</code>. Ví dụ: <code>bpmn-viewer.html?src=https://raw.githubusercontent.com/.../file.bpmn</code>');
    document.getElementById('annoList').innerHTML = '<div class="anno-empty">Chưa có sơ đồ để đọc ghi chú.</div>';
  } else {
    document.getElementById('srcLabel').textContent = src;
    document.getElementById('downloadBtn').style.display = 'inline-flex';
    document.getElementById('downloadBtn').onclick = () => window.open(src, '_blank');

    fetch(src)
      .then(res => {
        if(!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(xml => {
        renderAnnotations(xml);
        viewer = new BpmnJS({ container: '#canvas' });
        return viewer.importXML(xml);
      })
      .then(() => {
        document.getElementById('loading').style.display = 'none';
        fitViewport();
        enablePlainScrollZoom();
      })
      .catch(err => {
        showError(
          'Không tải/đọc được sơ đồ BPMN',
          `Lỗi: <code>${(err && err.message) || err}</code><br><br>
           Kiểm tra: (1) link phải trỏ tới file <b>.bpmn raw</b> (vd link "raw.githubusercontent.com", không phải link trang GitHub thường);
           (2) file phải là XML BPMN hợp lệ; (3) server chứa file phải cho phép CORS.`
        );
      });
  }

  function fitViewport(){
    if(viewer) viewer.get('canvas').zoom('fit-viewport');
  }
  function zoom(factor){
    if(viewer){
      const canvas = viewer.get('canvas');
      canvas.zoom(canvas.zoom() * factor);
    }
  }

  // Mặc định bpmn-js: lăn chuột = pan, phải giữ Ctrl mới zoom.
  // Đổi lại: lăn chuột thường = zoom luôn (tâm zoom tại vị trí con trỏ), khỏi cần giữ Ctrl.
  function enablePlainScrollZoom(){
    if(!viewer) return;
    try{
      // tắt hành vi scroll-to-pan / ctrl-scroll-to-zoom mặc định
      viewer.get('zoomScroll').toggle(false);
    }catch(e){ /* module có thể không tồn tại tùy bản build, bỏ qua */ }

    const canvasEl = document.getElementById('canvas');
    canvasEl.addEventListener('wheel', function(e){
      if(!viewer) return;
      e.preventDefault();
      const canvas = viewer.get('canvas');
      const rect = canvasEl.getBoundingClientRect();
      const offset = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      canvas.zoom(canvas.zoom() * factor, offset);
    }, { passive: false });
  }
</script>
</body>
</html>
